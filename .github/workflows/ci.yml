name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # A lingering next-server process once left a step's stdout pipe open for
    # 6 hours before GitHub's own timeout cancelled it. This job-level bound
    # is the fallback if that ever recurs; the per-step timeouts below on the
    # Playwright steps are the first line of defense.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: E2E and accessibility tests
        timeout-minutes: 5
        run: pnpm --filter docs exec playwright test
